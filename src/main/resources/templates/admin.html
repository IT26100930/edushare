<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('EduShare | Admin Dashboard')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <h1 style="font-size:2.2rem">Admin dashboard</h1>
    <div class="tabs">
        <a class="active" th:href="@{/admin}">Overview</a>
        <a th:href="@{/admin/users}">Users</a>
        <a th:href="@{/admin/subscriptions}">Subscriptions</a>
    </div>

    <div class="grid grid-4">
        <div class="card stat"><b th:text="${userTotal}">0</b><span>Users</span></div>
        <div class="card stat"><b th:text="${premiumTotal}">0</b><span>Premium members</span></div>
        <div class="card stat"><b th:text="${resourceTotal}">0</b><span>Resources</span></div>
        <div class="card stat"><b th:text="${downloadTotal}">0</b><span>Downloads</span></div>
        <div class="card stat"><b th:text="${openRequests}">0</b><span>Open requests</span></div>
        <div class="card stat"><b th:text="${categoryTotal}">0</b><span>Categories</span></div>
        <div class="card stat"><b>Rs. <span th:text="${revenue}">0</span></b><span>Demo revenue</span></div>
    </div>

    <section class="section">
        <h2>All resources</h2>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Title</th><th>Type</th><th>By</th><th>Access</th><th>Downloads</th><th></th></tr></thead>
                <tbody>
                <tr th:each="r : ${resources}">
                    <td><a th:href="@{/resources/{id}(id=${r.id})}" th:text="${r.title}">Title</a></td>
                    <td th:text="${r.typeLabel}">E-BOOK</td>
                    <td th:text="${r.uploaderName}">Admin</td>
                    <td th:text="${r.premium} ? 'Premium' : 'Free'">Free</td>
                    <td th:text="${r.downloads}">0</td>
                    <td class="row">
                        <a class="btn btn-small" th:href="@{/resources/{id}/edit(id=${r.id})}">Edit</a>
                        <form th:action="@{/resources/{id}/delete(id=${r.id})}" method="post" class="inline"
                              onsubmit="return confirm('Delete this resource?');">
                            <button class="btn btn-small btn-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
