<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('EduShare | Categories')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <h1 style="font-size:2.2rem">Categories</h1>
    <div class="grid grid-4">
        <a th:each="cc : ${categoryCounts}" class="card cat-card"
           th:href="@{/resources(category=${cc.category.id})}"
           th:style="'background:' + ${cc.category.color}">
            <h3 th:text="${cc.category.name}">Category</h3>
            <div class="count" th:text="${cc.count}">0</div>
            <span class="small">resources</span>
        </a>
    </div>

    <div class="card form-card section" th:if="${currentUser != null and currentUser.admin}">
        <h3>Add a category (admin)</h3>
        <form th:action="@{/categories/add}" method="post">
            <label for="name">Name</label>
            <input id="name" type="text" name="name" required>
            <label for="color">Colour</label>
            <input id="color" type="color" name="color" value="#4D96FF" style="height:46px">
            <button class="btn btn-primary" style="margin-top:1rem" type="submit">Add category</button>
        </form>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
