spring.application.name=EduShare E-Resource Sharing System
server.port=8080
spring.web.resources.static-locations=classpath:/static/
edushare.data-dir=${EDUSHARE_DATA_DIR:data}

edushare.upload-dir=data/uploads

# Shared server-side Google configuration for summaries and link content checks. Never commit API keys.
edushare.ai.api-key=${GEMINI_API_KEY:}
edushare.ai.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Videos: full file up to 250 MB plus a 20 MB preview. PDF endpoint still enforces 50 MB.
spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=275MB

# Real SMTP email. Configure all variables in IntelliJ Run Configuration (never commit secrets).
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
edushare.mail.from=${SMTP_FROM:}
edushare.public-url=${EDUSHARE_PUBLIC_URL:http://localhost:8080}
